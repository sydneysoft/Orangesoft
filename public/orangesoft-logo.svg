    <path d="M51 29c6-9 14-14 24-16" fill="none" stroke="#4F7D22" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="47" cy="62" r="36" fill="url(#fruit)"/>
    <path d="M25 44c6-10 15-15 25-16" fill="none" stroke="#FFE0A2" stroke-width="6" stroke-linecap="round" opacity=".68"/>
    <path d="M67 39c7 15 2 33-12 42" fill="none" stroke="#C93B00" stroke-width="5" stroke-linecap="round" opacity=".32"/>
    <circle cx="47" cy="62" r="21" fill="none" stroke="#FFF8EB" stroke-width="7" opacity=".95"/>
  </g>
  <text x="104" y="76" fill="#1A1A1A" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="-3">Orange<tspan fill="#ED6500">Soft</tspan></text>
</svg>
