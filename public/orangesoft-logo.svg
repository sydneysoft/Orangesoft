<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 112" role="img" aria-labelledby="title desc">
  <title id="title">OrangeSoft</title>
  <desc id="desc">OrangeSoft logo: a luminous orange fruit mark with a leaf and a clean wordmark</desc>
  <defs>
    <linearGradient id="fruit" x1="19" y1="20" x2="82" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBD55"/>
      <stop offset=".48" stop-color="#FF8418"/>
      <stop offset="1" stop-color="#E94B00"/>
    </linearGradient>
    <linearGradient id="leaf" x1="54" y1="11" x2="76" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D94C"/>
      <stop offset="1" stop-color="#568C25"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#C94400" flood-opacity=".2"/>
